<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Голова</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#f4f6f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Голова">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: one-screen app — header / view (map canvas or scrolling page) / bottom tabs. Map = Coggle-like branching tree on a dotted canvas. */
:root{
  --bg:#f4f6f2; --surface:#ffffff; --surface-2:#eceff0; --fg:#1b2220; --muted:#68716d; --line:#dde2dc;
  --dot:#cfd6cf; --node:#ffffff; --accent:#1f6b57; --accent-fg:#ffffff; --danger:#c2392f; --warn:#c7811a; --ok:#2c9a62;
  --f-fb:#3567d4; --f-tr:#de7420; --f-seo:#1f9566; --f-yt:#d6372f; --f-life:#8556c6; --f-ideas:#b28a12; --f-subs:#0f8a8a; --f-innov:#c2410c;
  --b1:#3f7fe0; --b2:#e0582f; --b3:#2aa071; --b4:#b04fc4; --b5:#d99a12; --b6:#1b9db3; --b7:#d6406f; --b8:#6b7f2a;
  --shadow:0 8px 28px rgba(20,40,30,.14);
  --font-display:'Unbounded','Onest',system-ui,sans-serif;
  --font-body:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121614; --surface:#1b211e; --surface-2:#232a27; --fg:#e8eeea; --muted:#94a09a; --line:#2e3833;
  --dot:#2b3430; --node:#1d2420; --accent:#5cc7a2; --accent-fg:#0d1a15; --danger:#ef6b5f; --warn:#e9a43c; --ok:#53c48a;
  --f-fb:#6b95f0; --f-tr:#f29a52; --f-seo:#4cc28e; --f-yt:#f06a60; --f-life:#ad86ea; --f-ideas:#dcb43c; --f-subs:#3cc4c4; --f-innov:#fb8a4c;
  --b1:#6fa0f2; --b2:#f2805a; --b3:#52c595; --b4:#c77fdc; --b5:#eab93e; --b6:#4cc2d6; --b7:#ef6f97; --b8:#a2b858;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1b211e; --surface-2:#232a27; --fg:#e8eeea; --muted:#94a09a; --line:#2e3833;
  --dot:#2b3430; --node:#1d2420; --accent:#5cc7a2; --accent-fg:#0d1a15; --danger:#ef6b5f; --warn:#e9a43c; --ok:#53c48a;
  --f-fb:#6b95f0; --f-tr:#f29a52; --f-seo:#4cc28e; --f-yt:#f06a60; --f-life:#ad86ea; --f-ideas:#dcb43c; --f-subs:#3cc4c4; --f-innov:#fb8a4c;
  --b1:#6fa0f2; --b2:#f2805a; --b3:#52c595; --b4:#c77fdc; --b5:#eab93e; --b6:#4cc2d6; --b7:#ef6f97; --b8:#a2b858;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
html{background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.4;display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--bg);min-height:58px}
.iconbtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn svg{width:20px;height:20px}
.ttl{flex:1;min-width:0}
.eyebrow{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ttl h1{margin:0;font-family:var(--font-display);font-weight:600;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;flex:none}
.seg button{padding:6px 11px;border-radius:8px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.sync{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.sync.ok{background:var(--ok)}.sync.slow{background:var(--warn)}.sync.err{background:var(--danger)}

main{flex:1;min-height:0;position:relative;display:flex}
#page{flex:1;overflow-y:auto;padding-block:16px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

/* Home */
.capture{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.capture-row{display:flex;gap:8px}
.capture input{flex:1;min-width:0;border:0;background:var(--surface-2);border-radius:10px;padding:11px 12px;font-size:16px}
.capture input:focus{outline:2px solid var(--accent)}
.btn{padding:10px 14px;border-radius:10px;font-weight:600;background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--danger)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 10px;border-radius:999px;font-size:13px;font-weight:500;border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.todaybar{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:var(--accent);color:var(--accent-fg);text-align:left;width:100%}
.todaybar b{font-family:var(--font-display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.todaybar span{flex:1;font-size:14px}
.section-h{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:128px;transition:transform .12s}
.fcard:active{transform:scale(.98)}
.fcard .glyph{width:30px;height:30px}
.fcard h2{margin:0;font-family:var(--font-display);font-weight:500;font-size:15px;line-height:1.25;text-wrap:balance}
.fcard .stats{font-size:13px;color:var(--muted);margin-top:auto;font-variant-numeric:tabular-nums}
.bar{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c)}

/* Lists */
.task{display:flex;align-items:flex-start;gap:8px;padding:9px 4px 9px calc(4px + var(--ind,0) * 22px);border-bottom:1px solid var(--line)}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--c,var(--muted));flex:none;display:grid;place-items:center;margin-top:1px}
.chk svg{width:14px;height:14px;opacity:0}
.task.done .chk{background:var(--c,var(--muted))}
.task.done .chk svg{opacity:1;color:var(--surface)}
.task .txt{flex:1;min-width:0;text-align:left;overflow-wrap:anywhere}
.task.done .txt .t{color:var(--muted);text-decoration:line-through}
.task .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px;font-size:12px;color:var(--muted)}
.tag{padding:1px 7px;border-radius:999px;background:var(--surface-2)}
.tag.hot{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--fg)}
.tag.late{background:color-mix(in srgb,var(--danger) 20%,transparent);color:var(--fg)}
.tag.f{background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--fg)}
.mini{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none}
.mini:hover{background:var(--surface-2)}
.mini svg{width:16px;height:16px}
.caret svg{transition:transform .15s}
.caret[aria-expanded="true"] svg{transform:rotate(90deg)}
.caret.none{visibility:hidden}
.listtools{display:flex;gap:8px;align-items:center}
.listtools .capture-row{flex:1}
.toggle{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-family:var(--font-display);font-weight:500;margin-bottom:4px}

/* Map */
#map{flex:1;position:relative;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);cursor:grab}
#map svg{position:absolute;inset:0;width:100%;height:100%}
.nd{cursor:pointer}
.nd text{font-family:var(--font-body);fill:var(--fg)}
.nd .root-t{font-family:var(--font-display);font-weight:600;fill:#fff}
.nd.done text{fill:var(--muted);text-decoration:line-through}
.nd .meta{font-size:11px;fill:var(--muted)}
.nd.sel rect.box{stroke:var(--fg)!important;stroke-width:2.5!important;stroke-opacity:1!important}
.tgl circle{fill:var(--surface);stroke-width:1.5}
.tgl text{font-size:11px;font-weight:600;text-anchor:middle}
.maptools{position:absolute;top:12px;right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px}
.maptools button{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;box-shadow:var(--shadow)}
.maptools svg{width:18px;height:18px}
.hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:6px 12px;border-radius:999px;white-space:nowrap;pointer-events:none}
.actions{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:12px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:var(--shadow)}
.actions::-webkit-scrollbar{display:none}
.actions button{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 10px;border-radius:10px;font-size:11.5px;font-weight:500;min-width:64px}
.actions button:hover{background:var(--surface-2)}
.actions button svg{width:20px;height:20px}
.actions .danger{color:var(--danger)}

/* Tabs + FAB */
.tabs{display:flex;border-top:1px solid var(--line);background:var(--surface);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;font-size:12px;font-weight:500;color:var(--muted);position:relative}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="true"]{color:var(--accent)}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;line-height:18px;font-variant-numeric:tabular-nums}
.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 12px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:18px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;box-shadow:var(--shadow);z-index:5}
.fab svg{width:26px;height:26px}

/* Sheet */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(10,20,15,.38)}
.panel{position:relative;width:100%;max-width:560px;background:var(--surface);border-radius:20px 20px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}.fcard{transition:none}}
.grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 2px}
.panel h3{margin:0;font-family:var(--font-display);font-weight:500;font-size:15px}
.panel .crumb{font-size:12px;color:var(--muted);margin-top:-6px}
.panel textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;resize:none;font-size:16px}
.panel textarea:focus{outline:2px solid var(--accent);border-color:transparent}
#fNote{font-size:14px}
.prow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.prow label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px 4px 4px 10px}
.prow input[type=date]{border:0;background:transparent;padding:5px;font-size:14px}
.prow input#fAmt{border:0;background:transparent;padding:5px;font-size:14px;width:90px;color:var(--text)}
.tag.amt{color:var(--f-subs);font-weight:600}
.pill{padding:8px 12px;border-radius:10px;font-size:13px;font-weight:500;border:1px solid var(--line)}
.pill[aria-pressed="true"]{background:color-mix(in srgb,var(--warn) 22%,transparent);border-color:var(--warn)}
.spacer{flex:1}

.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:12px;display:flex;gap:14px;align-items:center;z-index:30;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast button{color:var(--bg);font-weight:700;text-decoration:underline}
.menu-list{display:flex;flex-direction:column;gap:8px}
.menu-list .btn{text-align:left;display:flex;flex-direction:column;gap:2px;padding:12px 14px}
.menu-list .btn small{font-weight:400;color:var(--muted);font-size:12.5px}
.tokenin{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;font-size:16px}
.tokenin:focus{outline:2px solid var(--accent);border-color:transparent}
.panel{max-height:calc(100% - 40px);overflow-y:auto}
.nudge{font-size:13px;color:var(--muted);text-align:left;text-decoration:underline;padding:0}

.eyebrow{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Charts (Соцсети) — timeline style: mono labels, thick bars, hatched shortfall, shared goal line */
.charts{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1100px){.charts{grid-template-columns:repeat(3,minmax(0,1fr))}}
.chart{--mono:'JetBrains Mono',ui-monospace,Consolas,monospace;--goal:#f07a7a;--pr:84px;display:flex;flex-direction:column;gap:8px;min-width:0}
.ch-h{display:flex;align-items:baseline;gap:8px;padding:0 2px}
.ch-h h3{margin:0;flex:1;min-width:0;font-family:var(--mono);font-weight:600;font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.ch-k{font-family:var(--mono);font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);white-space:nowrap}
.chart .sub{font-size:12px;color:var(--muted);padding:0 2px;margin-top:-4px}
.tl{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 14px 14px;overflow:hidden;font-family:var(--mono)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tl{background:#141b26}}
:root[data-theme="dark"] .tl{background:#141b26}
.tl-in{position:relative}
.tl-g{position:absolute;left:0;right:var(--pr);top:0;bottom:0;pointer-events:none}
.tl-g i{position:absolute;top:22px;bottom:0;border-left:1px solid var(--line)}
.tl-g i span{position:absolute;top:-20px;left:5px;font-size:11px;color:var(--muted);white-space:nowrap}
.tl-g .gl{border-left:2px solid var(--goal);z-index:4;margin-left:-1px;top:4px}
.tl-g .gl span{top:-4px;color:var(--goal);font-weight:600;left:6px}
.tl-rows{position:relative;padding-top:26px;display:flex;flex-direction:column;gap:10px}
.tl-r{display:block;width:100%;text-align:left;padding:0;border-radius:8px}
.tl-r:hover .tl-b{filter:brightness(1.12)}
.tl-l{display:flex;align-items:center;gap:6px;font-family:var(--font-body);font-size:12px;color:var(--fg);margin-bottom:4px;min-width:0}
.tl-l>span:not(.logo):not(.pf){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-x{font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--c);white-space:nowrap}
.tl-l .pf,.tl-ch .pf{width:16px;height:16px;border-radius:5px;font-size:9px}
.tl-tr{position:relative;display:block;height:22px;margin-right:var(--pr)}
.tl-b{position:absolute;top:0;bottom:0;border-radius:7px;min-width:6px}
.tl-b.s{background:var(--c)}
.tl-b.h{background:repeating-linear-gradient(-45deg,var(--c) 0 5px,color-mix(in srgb,var(--c) 35%,transparent) 5px 10px);border-top-left-radius:0;border-bottom-left-radius:0}
.tl-b.s.j{border-top-right-radius:0;border-bottom-right-radius:0}
.tl-b.d{border:1.5px dashed color-mix(in srgb,var(--c) 80%,transparent);background:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--c) 45%,transparent) 0 5px,transparent 5px 10px)}
.tl-b.d.cut{border-left:0;border-top-left-radius:0;border-bottom-left-radius:0}
.tl-v{position:absolute;top:50%;transform:translateY(-50%);margin-left:8px;font-size:12px;color:var(--fg);white-space:nowrap;font-variant-numeric:tabular-nums}
.tl-v em{font-style:normal;color:var(--muted)}
.tl-v .ov{color:var(--c);font-weight:600}
.tl-ft{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);padding:0 2px}
.tl-ch{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 5px;border-radius:999px;border:1px dashed var(--line);background:var(--surface);color:var(--fg);font-size:12px}
.tl-ch em{font-style:normal;color:var(--muted);font-family:var(--mono);font-size:11px}
.tl-lg{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);padding:0 2px;margin-bottom:-2px}
.tl-lg span{display:inline-flex;align-items:center;gap:5px}
.tl-lg i{width:16px;height:8px;border-radius:3px;display:inline-block}
.tl-lg .k-s{background:var(--ok)}.tl-lg .k-w{background:var(--warn)}.tl-lg .k-d{background:var(--danger)}
.tl-lg .k-h{border:1px dashed var(--warn);background:repeating-linear-gradient(-45deg,var(--warn) 0 3px,transparent 3px 6px)}
.tl-lg .k-g{width:2px;height:12px;background:#f07a7a;border-radius:1px}
.up{color:var(--ok);font-weight:600}.dn{color:var(--danger);font-weight:600}.mid{color:var(--warn);font-weight:600}
.logo.xs{width:18px;height:18px;border-radius:5px;font-size:7.5px;letter-spacing:0}
/* Brands (Соцсети) */
.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--font-display);font-weight:600;font-size:14px;color:#fff;background:var(--bc,var(--accent));flex:none;letter-spacing:-.02em}
.logo.sm{width:28px;height:28px;border-radius:9px;font-size:10.5px}
.pf{width:20px;height:20px;border-radius:6px;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none;line-height:1}
.pf.yt{background:#e5242b}.pf.tt{background:#111;box-shadow:inset -2px 0 #25f4ee,inset 2px 0 #fe2c55}.pf.ig{background:linear-gradient(45deg,#f9a825,#e1306c,#833ab4)}.pf.th,.pf.x{background:#111}.pf.tg{background:#229ed9}.pf.wa{background:#25d366}.pf.fb{background:#1877f2}
.accs{display:flex;gap:6px;flex-wrap:wrap}
.acc{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:12.5px;font-variant-numeric:tabular-nums}
.acc b{font-weight:600}
.kpi{background:var(--bg);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.kpi .k1{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12.5px;color:var(--muted)}
.kpi .k1 b{color:var(--fg);font-family:var(--font-display);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.cbox{display:flex;gap:6px;align-items:center;border-top:1px dashed var(--line);padding-top:8px}
.cbox input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;font-size:16px}
.cbox input:focus{outline:2px solid var(--accent);border-color:transparent}
.cbox button{width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;flex:none}
.cbox button svg{width:18px;height:18px}
.clnote{background:color-mix(in srgb,var(--accent) 12%,transparent);border-left:3px solid var(--accent);border-radius:8px;padding:6px 10px;font-size:13.5px;white-space:pre-wrap}
.clnote b{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-bottom:2px}
.pend{display:flex;flex-direction:column;gap:4px;font-size:13px}
.pend div{background:color-mix(in srgb,var(--warn) 15%,transparent);border-radius:8px;padding:5px 9px}
.acrow{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.acrow .h{font-weight:600;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.acrow .s{font-size:12px;color:var(--muted);grid-column:2/4}
.acrow .v{font-family:var(--font-display);font-weight:600;font-variant-numeric:tabular-nums}
#fMet{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
#fMet input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;font-size:15px;min-width:0}
#fMet input.w{grid-column:1/-1}
#fMet span{grid-column:1/-1;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
@media (max-width:600px){.top{flex-wrap:wrap}.seg{order:5;width:100%}.seg button{flex:1}}
/* Sidebar (desktop): folders with pinned Claude chats */
.side{display:none}
@media (min-width:900px){
  body{padding-left:276px}
  .side{display:flex;flex-direction:column;gap:1px;position:fixed;left:0;top:0;bottom:0;width:276px;background:var(--surface);border-right:1px solid var(--line);padding:14px 10px 20px;overflow-y:auto;z-index:6}
  .tabs{display:none}
  .fab{bottom:24px}
}
.brand{font-family:var(--font-display);font-weight:600;font-size:18px;padding:4px 10px 12px}
.sl{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:10px;text-align:left;width:100%;font-weight:500;font-size:14px}
.sl:hover{background:var(--surface-2)}
.sl[aria-current="true"]{background:color-mix(in srgb,var(--accent) 15%,transparent)}
.sl .dot,.dot{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none;display:inline-block}
.sl .n{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.sl .n.red{color:var(--danger);font-weight:700}
.sl.chat{padding:6px 10px 6px 30px;font-weight:400;font-size:13px;color:var(--muted)}
.sl.chat[aria-current="true"]{color:var(--fg)}
.sl .t,.arow .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.sh{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 10px 4px}
.cdot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--muted)}
.cdot.wait{background:var(--b6)}.cdot.ans{background:var(--danger)}.cdot.done{background:var(--line)}.cdot.draft{background:var(--warn)}

/* Dashboard */
.wrap.wide{max-width:1100px}
.pulse{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pt{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.pt b{font-family:var(--font-display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--c)}
.pt span{font-size:12px;color:var(--muted);line-height:1.2}
.pt.zero b{color:var(--muted);opacity:.55}
@media (max-width:440px){.pt{padding:8px 9px}.pt b{font-size:19px}.pt span{font-size:11px}}
.tiles{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
@media (min-width:700px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ftile{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:14px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:8px;width:100%;transition:transform .12s}
.ftile:active{transform:scale(.99)}
.ft-h{display:flex;align-items:center;gap:8px}
.ft-h h2{margin:0;font-family:var(--font-display);font-weight:500;font-size:16px;flex:1;min-width:0}
.ft-goal,.pc-goal{font-size:13px;color:var(--muted)}
.ft-goal b{color:var(--fg);font-weight:600}
.ft-chips{display:flex;gap:6px;flex-wrap:wrap;font-size:12px}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--s) 16%,transparent);color:var(--fg);white-space:nowrap;flex:none}
.st::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--s)}
.tag.me{background:color-mix(in srgb,var(--b4) 20%,transparent);color:var(--fg)}
.tag.ok{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--fg)}
.prog{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog .bar{flex:1;height:6px;border-radius:3px}
.goalb{background:color-mix(in srgb,var(--c) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 35%,var(--line));border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.goalb b{font-family:var(--font-display);font-weight:500;font-size:15px}
.pgrid{display:grid;gap:10px;grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:1000px){.pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pcard{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--s);border-radius:16px;padding:10px 14px 8px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pc-h{display:flex;align-items:center;gap:8px;text-align:left;width:100%;padding:2px 0}
.pc-h .nm{font-family:var(--font-display);font-weight:500;font-size:15px;flex:1;min-width:0}
.pc-h .cv{width:16px;height:16px;color:var(--muted);transition:transform .15s;flex:none}
.pc-h[aria-expanded="true"] .cv{transform:rotate(90deg)}
.pc-line{font-size:13.5px;display:flex;gap:8px;align-items:baseline}
.pc-line b{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;flex:none;width:74px}
.pc-line span{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-width:0}
.pc-line em{font-style:normal}
.pc-f{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.pc-f .red{color:var(--danger)}
.lnk{font-size:13px;font-weight:600;color:var(--accent);padding:6px 8px;border-radius:8px}
.lnk:hover{background:var(--surface-2)}
.pc-body{border-top:1px solid var(--line);margin:0 -6px}
.pc-add{display:flex;gap:4px;flex-wrap:wrap;padding:6px 0 2px}
.arow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 4px;border-bottom:1px solid var(--line);font-size:14px}
.arow .tag{flex:none}
.hintp{font-size:13px;color:var(--muted);margin:4px 0}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.btn.sm{padding:6px 10px;font-size:13px}
/* Finance */
.fin{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:560px){.fin{grid-template-columns:repeat(4,minmax(0,1fr))}}
.fin div{background:var(--bg);border-radius:12px;padding:8px 10px;min-width:0}
.fin b{display:block;font-family:var(--font-display);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.fin span{font-size:11.5px;color:var(--muted)}
.hb{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:12px;color:var(--muted)}
.hb i{display:block;height:10px;border-radius:5px;width:var(--w);min-width:3px;background:var(--c)}
.fsec{display:flex;flex-direction:column;gap:2px}
.fsec h4{margin:4px 0 2px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fsec button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:5px 0;font-size:13.5px;flex-wrap:wrap}
.fsec button>span:first-child{flex:1;min-width:0}
.fsec .prog{width:100%}
/* Send bar + chat */
.sendbar{position:fixed;left:16px;right:90px;bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:7;background:var(--fg);color:var(--bg);border-radius:14px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);font-size:14px;max-width:560px}
.sendbar span{flex:1;min-width:0}
.sendbar button{background:var(--accent);color:var(--accent-fg);border-radius:10px;padding:9px 12px;font-weight:600;flex:none}
@media (min-width:900px){.sendbar{left:300px;bottom:24px}}
.chatv{display:flex;flex-direction:column;gap:10px;max-width:760px;margin:0 auto;min-height:100%}
.chat-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.msg{max-width:90%;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px}
.msg.me{align-self:flex-end;background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.msg .who{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.msg ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;white-space:normal}
.ref{font-size:11.5px;color:var(--muted);display:block}
.composer{display:flex;gap:8px;align-items:flex-end;position:sticky;bottom:0;background:var(--bg);padding:8px 0 4px;margin-top:auto}
.composer textarea{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;resize:vertical;font-size:16px;min-height:46px}
.composer textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.prow input.grow{flex:1;min-width:0;border:0;background:transparent;padding:5px;font-size:14px}
.prow label.grow{flex:1;min-width:180px}
.prow input#fPct{border:0;background:transparent;padding:5px;font-size:14px;width:56px}
</style>
</head>

<aside class="side" id="side"></aside>
<header class="top">
  <button class="iconbtn" id="back" aria-label="Назад" hidden><svg><use href="#i-back"/></svg></button>
  <div class="ttl"><span class="eyebrow" id="eyebrow">Голова</span><h1 id="title">Мирас</h1></div>

    <button data-mode="board" aria-pressed="true">Обзор</button>

  <div id="page"></div>

    <svg id="svg"><g id="cam"></g></svg>
    <div class="hint" id="hint" hidden>Нажми на центр → «Ветка»</div>

      <button id="zIn" aria-label="Приблизить"><svg><use href="#i-plus"/></svg></button>

<nav class="tabs">

</div>

  <div class="scrim" data-closemenu></div>
  <div class="panel">
    <div class="grip"></div>

    <div class="menu-list" id="syncOff">
      <input type="password" id="tokenInput" class="tokenin" placeholder="Вставь ключ GitHub (github_pat_…)" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="btn primary" id="tokenSave">Подключить синхронизацию</button>
    </div>
    <div class="menu-list" id="syncOn" hidden>
      <button class="btn" id="syncNowBtn">Синхронизировать сейчас<small>Само происходит при каждом изменении и раз в минуту</small></button>
      <button class="btn" id="tokenDrop">Отключить на этом устройстве<small>Задачи останутся в телефоне</small></button>
    </div>
    <h3 style="margin-top:6px">Резервная копия</h3>
    <div class="crumb" id="backupInfo"></div>
    <div class="menu-list">
      <button class="btn" id="exportBtn">Сохранить копию<small>Файл со всеми задачами: отправь себе в Telegram или сохрани в «Файлы»</small></button>
      <button class="btn" id="importBtn">Загрузить копию<small>Добавит задачи из файла; совпадающие обновит</small></button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
      <button class="btn" data-closemenu>Закрыть</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="keystore.js"></script>
<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ico = (id, cls='') => `<svg class="${cls}"><use href="#i-${id}"/></svg>`;

const FOLDERS = [
  {id:'fb',      name:'Facebook',               color:'var(--f-fb)'},
  {id:'social',  name:'Соцсети',                color:'var(--f-yt)'},
  {id:'traffic', name:'Новый источник трафика', color:'var(--f-tr)'},
  {id:'seo',     name:'SEO',                    color:'var(--f-seo)'},
  {id:'me',      name:'Личное',                 color:'var(--f-life)'},
];
const FM = Object.fromEntries(FOLDERS.map(f => [f.id, f]));
const OLDF = {yt:'social', life:'me', subs:'me', ideas:'social', innov:'fb'}; // folders of the old app version
const CHAT = '_chat';
const known = f => !!FM[f] || f === CHAT;
const ST = {
  go:   {l:'Идёт',              c:'var(--ok)'},
  risk: {l:'Риск',              c:'var(--warn)'},
  fire: {l:'Горит',             c:'var(--danger)'},
  me:   {l:'Нужно моё решение', c:'var(--b4)'},
  wait: {l:'Жду ответа',        c:'var(--b6)'},
  pause:{l:'Пауза',             c:'var(--muted)'},
  done: {l:'Готово',            c:'var(--muted)'},
};
const ST_ORDER = ['fire','me','risk','wait','go','pause','done'];
const stPill = s => s && ST[s] ? `<span class="st" style="--s:${ST[s].c}">${ST[s].l}</span>` : '';
const trunc = (s, n) => (s = String(s || '')).length > n ? s.slice(0, n-1) + '…' : s;
const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 12 || h > 14) ? b : c; };
const fmtTime = t => new Date(t).toLocaleString('ru-RU', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
const BR = ['--b1','--b2','--b3','--b4','--b5','--b6','--b7','--b8'].map(v => `var(${v})`);

/* ---------- dates ---------- */
const z = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());
const todayStr = () => ymd(new Date());
const dayDiff = s => Math.round((new Date(s+'T00:00') - new Date(todayStr()+'T00:00'))/864e5);
function fmtDue(s){
  if(!s) return '';
  const d = dayDiff(s);
  if(d===0) return 'сегодня'; if(d===1) return 'завтра'; if(d===-1) return 'вчера';
  return new Date(s+'T00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
}
const isLate = n => !n.done && n.due && n.due < todayStr();
const isToday = n => !n.done && (n.today || (n.due && n.due <= todayStr()));

/* ---------- store ---------- */
let nodes = new Map();
let col = null;
const LS = 'cg2-nodes', LS_SYNCED = 'cg2-synced';
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k,v); } catch {} };
try { JSON.parse(lsGet(LS) || '[]').forEach(n => { if(OLDF[n.f]) n.f = OLDF[n.f]; nodes.set(n.id, n); }); } catch {}
const saveLocal = () => lsSet(LS, JSON.stringify([...nodes.values()]));

const queues = new Map();
function enqueue(id, fn){
  const p = (queues.get(id) || Promise.resolve()).then(fn).catch(e => {
    console.warn(e);
    if(e && e.code === 'quota_exceeded') toast('Хранилище заполнено — удалите старые выполненные задачи');
    else if(e && e.code === 'invalid_argument') toast('Не удалось сохранить: нет прав на запись');
  });
  queues.set(id, p);
}
const bodyOf = n => { const b = {...n}; delete b.id; return b; };
let tombs = {};
try { tombs = JSON.parse(lsGet('cg2-tombs') || '{}') || {}; } catch {}
const saveTombs = () => lsSet('cg2-tombs', JSON.stringify(tombs));
function put(n, quiet){
  n.ts = Date.now();
  nodes.set(n.id, n); saveLocal();
  if(col) enqueue(n.id, () => col.doc(n.id).set(bodyOf(n)));
  scheduleSync();
  if(!quiet) render();
}
function removeIds(ids){
  const now = Date.now();
  ids.forEach(id => { nodes.delete(id); tombs[id] = now; if(col) enqueue(id, () => col.doc(id).delete()); });
  saveLocal(); saveTombs(); scheduleSync(); render();
}
const newId = () => 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);

function setSync(state){
  const el = $('#sync');
  el.className = 'sync ' + state;
  el.title = {ok:'Синхронизировано между устройствами', local:'Только на этом устройстве', slow:'Нет связи с хранилищем — показана сохранённая копия', err:'Ошибка синхронизации — данные сохранены на устройстве'}[state] || '';
}
setSync('local');

async function initDb(){
  if(!window.claude || !window.claude.use) return;
  let db = null;
  try { db = await window.claude.use('db'); } catch {}
  if(!db) return;
  col = db.collection('nodes');
  let timer = setTimeout(() => setSync('slow'), 10000);
  let first = true;
  col.onSnapshot(snap => {
    if(snap.metadata.fromCache && first && snap.empty && nodes.size) return; // keep local copy until store answers
    if(!snap.metadata.fromCache){
      clearTimeout(timer); setSync('ok');
      if(first){
        first = false;
        if(snap.empty && nodes.size && !lsGet(LS_SYNCED)){
          lsSet(LS_SYNCED,'1');
          [...nodes.values()].forEach(n => enqueue(n.id, () => col.doc(n.id).set(bodyOf(n))));
          return;
        }
        lsSet(LS_SYNCED,'1');
      }
    }
    const m = new Map();
    snap.docs.forEach(d => m.set(d.id, {...d.data(), id:d.id}));
    nodes = m; saveLocal(); render();
  }, () => { clearTimeout(timer); setSync('err'); });
}

/* ---------- tree helpers ---------- */
function index(){
  const m = new Map();
  for(const n of nodes.values()){
    const k = n.f + '|' + (n.p || '');
    if(!m.has(k)) m.set(k, []);
    m.get(k).push(n);
  }
  for(const a of m.values()) a.sort((a,b) => (a.o||0) - (b.o||0));
  return m;
}
function descendants(id){
  const out = [], stack = [id];
  while(stack.length){
    const cur = stack.pop();
    for(const n of nodes.values()) if(n.p === cur){ out.push(n.id); stack.push(n.id); }
  }
  return out;
}
function crumb(n){
  const parts = []; let p = n.p ? nodes.get(n.p) : null; let guard = 0;
  while(p && guard++ < 20){ parts.unshift(p.t); p = p.p ? nodes.get(p.p) : null; }
  return parts;
}
function folderStats(f){
  let open=0, done=0, today=0;
  for(const n of nodes.values()) if(n.f===f){ n.done ? done++ : open++; if(isToday(n)) today++; }
  return {open, done, today, total: open+done};
}

/* ---------- dashboard helpers ---------- */
const isChat = n => n.f === CHAT;
const tasks = () => [...nodes.values()].filter(n => !isChat(n));
const chats = () => [...nodes.values()].filter(n => isChat(n) && n.st !== 'draft');
const draftOf = f => nodes.get('draft-' + f);
const draftCount = f => { const d = draftOf(f); return d && d.items ? d.items.length : 0; };
const isSubNode = n => !!(n && n.p && nodes.get(n.p) && nodes.get(n.p).fk === 'sub');
function subtree(id, idx, f){ const out = []; (function rec(pid){ for(const k of idx.get(f+'|'+pid) || []){ out.push(k); rec(k.id); } })(id); return out; }
function progress(n, desc){
  if(n.pct !== undefined && n.pct !== null && n.pct !== '') return Math.max(0, Math.min(100, +n.pct || 0));
  { const v = num(n.kv), t = num(n.kt); if(v !== null && t) return Math.max(0, Math.min(100, Math.round(v / t * 100))); }
  if(n.fin) return null;
  const t = desc.filter(d => !d.fk); if(!t.length) return null;
  return Math.round(t.filter(d => d.done).length / t.length * 100);
}
function autoSt(n, desc){
  if(n.st) return n.st;
  if(n.done) return 'done';
  const open = desc.filter(d => !d.done);
  if(desc.some(isLate) || open.some(d => d.st === 'fire')) return 'fire';
  for(const s of ['me','risk','wait']) if(open.some(d => d.st === s)) return s;
  return open.some(d => !d.fk) ? 'go' : '';
}
const worst = arr => ST_ORDER.find(s => arr.includes(s)) || '';
function projInfo(n, idx){
  const desc = subtree(n.id, idx, n.f).filter(d => !d.plat);
  const open = desc.filter(d => !d.done && !d.fk);
  const late = desc.filter(isLate);
  const next = open.filter(d => d.due).sort((a,b) => a.due.localeCompare(b.due))[0] || null;
  const last = desc.filter(d => !d.fk).sort((a,b) => (b.created||0) - (a.created||0))[0] || null;
  return {desc, open, late, next, last, pct: progress(n, desc), st: autoSt(n, desc)};
}
function folderParts(f, idx){
  const tops = idx.get(f+'|') || [];
  const goals = tops.filter(n => n.k === 'goal');
  const projs = tops.filter(n => n.k !== 'goal' && (n.proj || (idx.get(f+'|'+n.id) || []).length));
  const loose = tops.filter(n => n.k !== 'goal' && !projs.includes(n));
  return {goals, projs, loose};
}
function attention(f){
  const out = [];
  for(const c of chats()) if((!f || c.folder === f) && c.unread) out.push({kind:'chat', n:c, w:0});
  for(const n of tasks()){
    if((f && n.f !== f) || n.done || n.fk) continue;
    if(isLate(n)) out.push({kind:'late', n, w:1});
    else if(n.st === 'fire') out.push({kind:'fire', n, w:1});
    else if(n.st === 'me') out.push({kind:'me', n, w:2});
    else if(n.due && dayDiff(n.due) <= 2) out.push({kind:'soon', n, w:3});
  }
  return out.sort((a,b) => a.w - b.w || (a.n.due||'').localeCompare(b.n.due||''));
}
function pulse(f){
  const t = tasks().filter(n => (!f || n.f === f) && !n.done);
  const cs = chats().filter(c => !f || c.folder === f);
  return {
    fire: t.filter(n => isLate(n) || n.st === 'fire').length,
    me: t.filter(n => n.st === 'me').length,
    ans: cs.filter(c => c.unread).length,
    wait: cs.filter(c => c.st === 'wait').length + t.filter(n => n.st === 'wait').length,
  };
}
const lastAt = c => (c.msgs || []).reduce((m, x) => Math.max(m, x.at || 0), c.created || 0);
const byAct = (a, b) => lastAt(b) - lastAt(a);
const CST = {wait:'Ждёт Клода', ans:'Клод ответил', done:'Учтено'};
function pendMap(f){ const m = new Map(); const d = draftOf(f); (d && d.items || []).forEach(i => m.set(i.ref || '', (m.get(i.ref || '') || 0) + 1)); return m; }

/* ---------- money (finance folder) ---------- */
function money(s){
  s = String(s || '').toLowerCase(); if(!s.trim()) return null;
  const segs = s.split(/→|->|;/);
  const seg = segs.find(x => /\/|в\s*(год|мес)/.test(x)) || segs[0];
  const m = seg.match(/(\d[\d\s]*(?:[.,]\d+)?)\s*(к\b|k\b|тыс)?/); if(!m) return null;
  let v = parseFloat(m[1].replace(/\s/g, '').replace(',', '.')); if(m[2]) v *= 1000;
  if(!isFinite(v)) return null;
  const cur = /\$|usd|долл/.test(seg) ? '$' : /₸|тг|kzt|тенге/.test(seg) ? '₸' : /₽|руб/.test(seg) ? '₽' : /£/.test(seg) ? '£' : '€';
  const per = /год|year|\/\s*г\b/.test(seg) ? 'y' : /нед|week/.test(seg) ? 'w' : /разов|once/.test(seg) ? 'once' : /\/\s*(дн|день|day)/.test(seg) ? 'd' : 'm';
  return {v, cur, per};
}
const monthly = m => m.per === 'y' ? m.v/12 : m.per === 'w' ? m.v*4.33 : m.per === 'd' ? m.v*30 : m.per === 'once' ? 0 : m.v;
const fmtM = o => { const k = Object.keys(o); if(!k.length) return '—'; return k.map(c => { const v = Math.round(o[c]); const s = Math.abs(v).toLocaleString('ru-RU'); return (v < 0 ? '−' : '') + (c === '$' ? '$' + s : s + ' ' + c); }).join(' · '); };
function finance(fin, idx){
  const secs = idx.get(fin.f+'|'+fin.id) || [];
  const by = fk => secs.filter(s => s.fk === fk).flatMap(s => subtree(s.id, idx, fin.f)).filter(x => !x.done);
  const sum = (arr, fn) => { const o = {}; arr.forEach(x => { const m = money(x.amt); if(m){ const v = fn(m); if(v) o[m.cur] = (o[m.cur] || 0) + v; } }); return o; };
  const inc = sum(by('inc'), monthly), exp = sum([...by('exp'), ...by('sub')], monthly), dep = sum(by('dep'), m => m.v);
  const left = {}; new Set([...Object.keys(inc), ...Object.keys(exp)]).forEach(c => left[c] = (inc[c] || 0) - (exp[c] || 0));
  const renew = by('sub').filter(x => x.due).sort((a,b) => a.due.localeCompare(b.due)).slice(0, 3);
  return {inc, exp, dep, left, renew, goals: by('goal')};
}
function financeHTML(fi){
  const tile = (l, o) => `<div><span>${l}</span><b>${fmtM(o)}</b></div>`;
  const cur = Object.keys({...fi.inc, ...fi.exp})[0];
  let bars = '';
  if(cur){ const a = fi.inc[cur] || 0, b = fi.exp[cur] || 0, mx = Math.max(a, b, 1);
    bars = `<div class="hb"><span>Доход</span><i style="--w:${a/mx*100}%;--c:var(--ok)"></i><span>Расход</span><i style="--w:${b/mx*100}%;--c:var(--danger)"></i></div>`; }
  const goals = fi.goals.map(g => { const p = progress(g, []) ?? 0; return `<button data-edit="${g.id}"><span>${esc(g.t)}${g.amt ? ` · ${esc(g.amt)}` : ''}</span><div class="prog"><div class="bar" style="--c:var(--accent)"><i style="width:${p}%"></i></div>${p}%</div></button>`; }).join('');
  const renew = fi.renew.map(s => `<button data-edit="${s.id}"><span>${esc(s.t)}</span><span class="tag ${dayDiff(s.due) <= 7 ? 'hot' : ''}">до ${fmtDue(s.due)}</span>${s.amt ? `<span class="tag amt">${esc(s.amt)}</span>` : ''}</button>`).join('');
  const empty = !Object.keys(fi.inc).length && !Object.keys(fi.dep).length;
  return `<div class="fin">${tile('Доход / мес', fi.inc)}${tile('Расход / мес', fi.exp)}${tile('Остаток / мес', fi.left)}${tile('Депозит', fi.dep)}</div>${bars}
    ${renew ? `<div class="fsec"><h4>Ближайшие продления</h4>${renew}</div>` : ''}
    ${goals ? `<div class="fsec"><h4>Финансовые цели</h4>${goals}</div>` : ''}
    ${empty ? `<p class="hintp">Открой «Финансы» стрелкой и добавь суммы в разделы «Доходы», «Расходы», «Депозит», «Цели». Пиши как удобно: «2500 €/мес», «$10.68/год», «5000 €».</p>` : ''}`;
}

/* ---------- routing ---------- */
let route = {view:'home'};
function parse(h){
  h = (h||'').replace(/^#/,'');
  if(h === 'today' || h === 'chats') return {view:h};
  let m = h.match(/^c-(.+)$/);
  if(m) return {view:'chat', id: decodeURIComponent(m[1])};
  m = h.match(/^f-([a-z]+)(?:-(map|list))?$/);
  if(m && FM[m[1]]) return {view:'folder', f:m[1], mode: m[2] || 'board'};
  return {view:'home'};
}
const hashOf = r => r.view==='today' || r.view==='chats' ? r.view : r.view==='chat' ? 'c-'+encodeURIComponent(r.id) : r.view==='folder' ? 'f-'+r.f+(r.mode!=='board'?'-'+r.mode:'') : 'home';
function go(r){
  route = r; selected = null; render();
  try { if(location.hash !== '#'+hashOf(r)) location.hash = hashOf(r); } catch {}
}
addEventListener('hashchange', () => {
  const r = parse(location.hash);
  if(hashOf(r) !== hashOf(route)){ route = r; selected = null; render(); }
});

/* ---------- render ---------- */
const page = $('#page'), mapEl = $('#map');
function render(){
  const keep = {}; document.querySelectorAll('.cbox').forEach(fm => { const v = fm.querySelector('input').value; if(v) keep[fm.dataset.cform] = v; });
  const focId = document.activeElement && document.activeElement.closest ? (document.activeElement.closest('.cbox') || {dataset:{}}).dataset.cform : null;
  renderInner();
  for(const id in keep){ const i = document.querySelector(`[data-cform="${id}"] input`); if(i && !i.value) i.value = keep[id]; }
  if(focId){ const i = document.querySelector(`[data-cform="${focId}"] input`); if(i) i.focus(); }
}
function renderInner(){
  const r = route, inFolder = r.view === 'folder';
  $('#back').hidden = !(inFolder || r.view === 'chat');
  $('#seg').hidden = !inFolder;
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-current', String(b.dataset.tab === r.view || (b.dataset.tab==='home' && inFolder) || (b.dataset.tab==='chats' && r.view==='chat'))));
  const tc = tasks().filter(isToday).length;
  $('#badge').hidden = !tc; $('#badge').textContent = tc;
  const uc = chats().filter(c => c.unread).length;
  $('#badge2').hidden = !uc; $('#badge2').textContent = uc;

  if(inFolder){
    $('#eyebrow').textContent = 'Мирас › папка';
    $('#title').textContent = FM[r.f].name;
    document.querySelectorAll('#seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === r.mode)));
  } else if(r.view === 'today'){
    $('#eyebrow').textContent = new Date().toLocaleDateString('ru-RU',{weekday:'long', day:'numeric', month:'long'});
    $('#title').textContent = 'Сегодня';
  } else if(r.view === 'chats'){
    $('#eyebrow').textContent = 'Клод';
    $('#title').textContent = 'Чаты по папкам';
  } else if(r.view === 'chat'){
    const c = nodes.get(r.id);
    $('#eyebrow').textContent = 'Чат · ' + (c && FM[c.folder] ? FM[c.folder].name : '');
    $('#title').textContent = c ? c.t : 'Чат';
  } else {
    $('#eyebrow').textContent = 'Голова';
    $('#title').textContent = 'Мирас';
  }

  const isMap = inFolder && r.mode === 'map';
  mapEl.hidden = !isMap; page.hidden = isMap;
  $('#fab').hidden = (isMap && !!selected) || r.view === 'chat';
  if(isMap) renderMap();
  else if(inFolder && r.mode === 'list') renderList();
  else if(inFolder) renderBoard();
  else if(r.view === 'today') renderToday();
  else if(r.view === 'chats') renderChats();
  else if(r.view === 'chat') renderChat();
  else renderHome();
  renderSendbar(); renderSide();
}

/* ---------- shared blocks ---------- */
let captureFolder = lsGet('cg2-capf') || 'me';
if(!FM[captureFolder]) captureFolder = 'me';
function folderChips(active, attr){
  return FOLDERS.map(f => `<button type="button" class="chip" style="--c:${f.color}" data-${attr}="${f.id}" aria-pressed="${f.id===active}"><span class="dot"></span>${esc(f.name)}</button>`).join('');
}
function pulseHTML(p){
  const t = (n, l, c, tab) => `<button class="pt ${n ? '' : 'zero'}" style="--c:${c}" data-tab="${tab}"><b>${n}</b><span>${l}</span></button>`;
  return `<div class="pulse">${t(p.fire, 'Горит', 'var(--danger)', 'today')}${t(p.me, 'Моё решение', 'var(--b4)', 'today')}${t(p.ans, 'Ответы Клода', 'var(--accent)', 'chats')}${t(p.wait, 'Ждём ответа', 'var(--b6)', 'chats')}</div>`;
}
function attRow(a){
  const n = a.n;
  if(a.kind === 'chat') return `<button class="arow" data-chat="${n.id}"><span class="cdot ans"></span><span class="t">💬 Клод ответил: ${esc(n.t)}</span>${route.view !== 'folder' && FM[n.folder] ? `<span class="tag">${esc(FM[n.folder].name)}</span>` : ''}</button>`;
  const lab = {late:['просрочено ' + fmtDue(n.due), 'late'], fire:['горит', 'late'], me:['нужно твоё решение', 'me'], soon:[fmtDue(n.due), 'hot']}[a.kind];
  const c = crumb(n);
  return `<div class="task" style="--c:${FM[n.f].color}"><button class="chk" data-done="${n.id}" aria-label="Выполнено">${ico('check')}</button>

const PF = {yt:['▶','YouTube'], tt:['♪','TikTok'], ig:['◎','Instagram'], th:['@','Threads'], tg:['✈','Telegram'], x:['X','X'], wa:['✆','WhatsApp'], fb:['f','Facebook']};
const pfIcon = p => PF[p] ? `<span class="pf ${p}" title="${PF[p][1]}">${PF[p][0]}</span>` : '';
const num = v => { if(v === '' || v === null || v === undefined) return null; const x = parseFloat(String(v).replace(/\s/g, '').replace(',', '.')); return isFinite(x) ? x : null; };
const fmtN = v => { const x = num(v); if(x === null) return esc(v || '—'); return x >= 1e6 ? (x/1e6).toLocaleString('ru-RU', {maximumFractionDigits:1}) + ' млн' : x >= 1e4 ? (x/1e3).toLocaleString('ru-RU', {maximumFractionDigits:1}) + ' тыс.' : x.toLocaleString('ru-RU'); };
const logoHTML = (n, sm) => `<span class="logo ${sm ? 'sm' : ''}" style="--bc:${n.bc || 'var(--accent)'}" title="${esc(n.t)}">${esc(n.logo || n.t.slice(0, 2))}</span>`;
function projCard(n, idx, pend){

    (function rec(pid, depth){

      <div class="pc-add"><button class="lnk" data-addchild="${n.id}">＋ Задача</button><button class="lnk" data-edit="${n.id}">Цель, показатели, статус</button><button class="lnk" data-showdone>${showDone ? 'Скрыть' : 'Показать'} выполненные</button></div></div>`;

  return `<article class="pcard" style="--s:${sc}">
    <button class="pc-h" data-expand="${n.id}" aria-expanded="${open}">${n.brand ? logoHTML(n) : ''}<span class="nm">${esc(n.t)}</span>${stPill(p.st)}${ico('caret','cv')}</button>
    ${accs.length ? `<div class="accs">${accs.map(a => `<span class="acc">${pfIcon(a.plat)}${esc(a.handle || a.t)}${num(a.subs) !== null ? ` · <b>${fmtN(a.subs)}</b>` : ''}</span>`).join('')}</div>` : ''}
    ${n.goal ? `<div class="pc-goal">🎯 ${esc(n.goal)}</div>` : ''}
    ${kpi || (p.pct !== null ? `<div class="prog"><div class="bar" style="--c:${sc}"><i style="width:${p.pct}%"></i></div>${p.pct}%</div>` : '')}
    ${n.fin ? financeHTML(finance(n, idx)) : ''}
    ${n.cl ? `<div class="clnote"><b>Клод · ${fmtTime(n.cl.at)}</b>${esc(n.cl.t)}</div>` : ''}
    ${chats().some(c => c.st === 'wait' && (c.msgs || []).some(m => (m.items || []).some(i => i.ref === n.id))) ? `<div class="pc-goal">⏳ Комментарии у Клода — ответ придёт в чат папки</div>` : ''}
    ${n.ctype ? `<div class="pc-line"><b>Контент</b><span>${esc(n.ctype)}</span></div>` : ''}
    ${n.auto ? `<div class="pc-line"><b>Клод</b><span>${esc(n.auto)}</span></div>` : ''}

    ${!n.fin && p.next ? `<div class="pc-line"><b>Дальше</b><span>${esc(p.next.t)} <em class="tag ${isLate(p.next) ? 'late' : 'hot'}">${fmtDue(p.next.due)}</em></span></div>` : ''}
    <div class="pc-f"><span>${p.open.length} открыто${p.late.length ? ` · <b class="red">${p.late.length} просрочено</b>` : ''}</span><span class="spacer"></span><button class="lnk" data-expand="${n.id}">${open ? 'Свернуть' : 'Подробнее'}</button></div>

/* ---------- charts for Соцсети (timeline style) ---------- */
// Every row is scaled to its own target (goal / usual / plan = 100%), so one vertical line marks the target for all rows.
function socialCharts(idx){
  const brands = (idx.get('social|') || []).filter(n => n.brand);
  const rows = brands.flatMap(b => (idx.get('social|' + b.id) || []).filter(a => a.plat).map(a => ({a, b})));
  if(!rows.length) return '';
  const pc = x => Math.round(x * 100) + '%';
  const fK = v => v >= 1e6 ? (v/1e6).toLocaleString('ru-RU', {maximumFractionDigits:1}) + 'M' : v >= 1e3 ? (v/1e3).toLocaleString('ru-RU', {maximumFractionDigits:v >= 1e4 ? 0 : 1}) + 'K' : String(Math.round(v));
  const lab = (r, st) => `<span class="tl-l">${logoHTML(r.b, true).replace('logo sm', 'logo xs')}${pfIcon(r.a.plat)}<span>${esc(r.a.handle || r.a.t)}</span><b class="tl-x">${st}</b></span>`;
  const tip = (r, txt) => esc(r.b.t + ' · ' + (PF[r.a.plat] ? PF[r.a.plat][1] : '') + ' ' + (r.a.handle || '') + ' — ' + txt + (r.a.mnote ? ' (' + r.a.mnote + ')' : ''));
  const chip = (r, v) => `<button class="tl-ch" data-edit="${r.a.id}" title="${tip(r, v || 'нет данных')}">${logoHTML(r.b, true).replace('logo sm', 'logo xs')}${pfIcon(r.a.plat)}${esc(r.a.handle || r.a.t)}${v ? ` <em>${esc(v)}</em>` : ''}</button>`;
  const col = k => k >= 1 ? 'var(--ok)' : k >= .5 ? 'var(--warn)' : 'var(--danger)';
  const plot = (items, glab, unit) => {
    const mx = Math.min(2, Math.max(1.25, ...items.map(i => i.k * 1.05)));
    const x = k => Math.min(Math.max(k, 0), mx) / mx * 100;
    const ticks = [0, .5, 1.5, 2].filter(t => t <= mx + 1e-9).map(t => `<i style="left:${x(t)}%"><span>${t ? pc(t) : '0'}</span></i>`).join('');
    const bars = items.map(i => {
      const k = Math.max(0, i.k);
      let b;
      if(k < 1) b = (k > 0 ? `<i class="tl-b s" style="left:0;width:${x(k)}%"></i>` : '') + `<i class="tl-b d ${k > 0 ? 'cut' : ''}" style="left:${x(k)}%;width:${x(1) - x(k)}%"></i>`;
      else b = `<i class="tl-b s ${k > 1 ? 'j' : ''}" style="left:0;width:${x(1)}%"></i>` + (k > 1 ? `<i class="tl-b h" style="left:${x(1)}%;width:${x(k) - x(1)}%"></i>` : '');
      const st = unit === 'x' ? '×' + i.k.toLocaleString('ru-RU', {maximumFractionDigits:1}) : pc(i.k);
      return `<button class="tl-r" style="--c:${i.c}" data-edit="${i.r.a.id}" title="${tip(i.r, i.t)}">${lab(i.r, st)}<span class="tl-tr">${b}<span class="tl-v" style="left:${Math.max(x(k), x(1))}%">${i.val}</span></span></button>`;
    }).join('');
    return `<div class="tl"><div class="tl-in"><div class="tl-g">${ticks}<i class="gl" style="left:${x(1)}%"><span>${glab}</span></i></div><div class="tl-rows">${bars}</div></div></div>`;
  };
  const card = (h, sub, items, glab, unit, okHi, rest, restLab) => {
    const ok = items.filter(i => i.k >= okHi).length;
    const kc = !items.length ? 'var(--muted)' : ok === items.length ? 'var(--ok)' : ok * 2 >= items.length ? 'var(--warn)' : 'var(--danger)';
    return `<section class="chart">
      <div class="ch-h"><h3>${h}</h3><span class="ch-k" style="--c:${kc}">${items.length ? `${ok} из ${items.length} в норме` : 'нет данных'}</span></div>
      <div class="sub">${sub}</div>
      ${items.length ? plot(items, glab, unit) : ''}
      ${rest.length ? `<div class="tl-ft">${restLab}: ${rest.join('')}</div>` : ''}
    </section>`;
  };
  // 1. Подписчики: прирост за неделю против недельной цели
  const i1 = [], r1 = [];
  rows.forEach(r => {
    const sN = num(r.a.subs), wg = num(r.a.wg);
    if(sN === null){ r1.push(chip(r, '')); return; }
    const g = sN - (num(r.a.w0) ?? sN);
    if(!wg){ r1.push(chip(r, (g >= 0 ? '+' : '−') + fmtN(Math.abs(g)))); return; }
    i1.push({r, k: g / wg, c: col(g / wg), val: `${g >= 0 ? '+' : '−'}${fK(Math.abs(g))}<em> / +${fK(wg)}</em>`, t: `подписчиков ${fmtN(sN)}, за неделю ${g >= 0 ? '+' : ''}${g}, цель недели +${wg}`});
  });
  // 2. Просмотры: среднее 5 последних против обычного
  const i2 = [], r2 = [];
  rows.forEach(r => {
    const a5 = num(r.a.avg5), av = num(r.a.avgv);
    if(a5 === null || !av){ r2.push(chip(r, a5 !== null ? '5 посл. ' + fmtN(a5) : av ? 'обычно ' + fmtN(av) : '')); return; }
    const k = a5 / av;
    i2.push({r, k, c: k >= 1 ? 'var(--ok)' : k >= .8 ? 'var(--f-subs)' : k >= .5 ? 'var(--warn)' : 'var(--danger)', val: `${fK(a5)}<em> / ${fK(av)}</em>`, t: `5 последних в среднем ${a5}, обычно ${av}`});
  });
  // 3. Публикации за 7 дней против плана
  const i3 = [], r3 = [];
  rows.forEach(r => {
    const p = num(r.a.posts7) ?? 0, pl = num(r.a.plan7);
    if(!pl){ r3.push(chip(r, p ? p + ' шт.' : 'пауза')); return; }
    i3.push({r, k: p / pl, c: col(p / pl), val: `${p}<em> / ${pl}</em>`, t: `опубликовано ${p} за 7 дней, план ${pl}`});
  });
  return `<div class="tl-lg"><span><i class="k-s"></i>в плане</span><span><i class="k-w"></i>отстаём</span><span><i class="k-d"></i>меньше половины</span><span><i class="k-h"></i>недобор до цели</span><span><i class="k-g"></i>цель = 100%</span></div>
  <div class="charts">
    ${card('Подписчики · неделя', 'Прирост с понедельника, красная линия — цель недели', i1, 'цель', '%', 1, r1, 'без цели')}
    ${card('Просмотры · 5 последних', 'Среднее 5 последних против обычного уровня', i2, 'обычно', 'x', .8, r2, 'мало данных')}
    ${card('Публикации · 7 дней', 'Работает ли контент-ферма: факт против плана', i3, 'план', '%', 1, r3, 'без плана')}
  </div>`;
}

function cam(){ return cams[route.f] || (cams[route.f] = {x:0,y:0,k:1}); }

  if(!g){ if(selected){ selected = null; render(); } return; }
  const id = g.dataset.id, now = Date.now();
  if(id === lastTap.id && now - lastTap.t < 380 && id === selected){ lastTap = {id:null,t:0}; if(id === 'root') openNew(route.f, null); else openEdit(id); return; }
  lastTap = {id, t:now};
  selected = id; render();
}
function toggleCollapse(id){ const n = nodes.get(id); if(!n) return; put({...n, c: !n.c}); }

function renderActions(){
  const bar = $('#actions');
  if(!selected || (selected !== 'root' && !nodes.has(selected))){ bar.hidden = true; $('#fab').hidden = false; return; }
  bar.hidden = false; $('#fab').hidden = true;
  const b = (act, icon, label, cls='') => `<button data-act="${act}" class="${cls}">${ico(icon)}${label}</button>`;
  if(selected === 'root'){ bar.innerHTML = b('child','child','Ветка'); return; }
  const n = nodes.get(selected);
  const hasKids = [...nodes.values()].some(x => x.p === n.id);
  bar.innerHTML = b('child','child','Подзадача') + b('sib','sib','Рядом') + b('done','check', n.done ? 'Вернуть' : 'Готово')
    + b('comment','chat','Коммент') + b('today','sun', n.today ? 'Не сегодня' : 'Сегодня') + b('edit','edit','Изменить')
    + (hasKids ? b('fold','fold', n.c ? 'Раскрыть' : 'Свернуть') : '') + b('del','trash','Удалить','danger');
}
$('#actions').addEventListener('click', e => {
  const btn = e.target.closest('[data-act]'); if(!btn) return;
  const act = btn.dataset.act, f = route.f;
  if(selected === 'root'){ openNew(f, null); return; }
  const n = nodes.get(selected); if(!n) return;
  if(act === 'child') openNew(f, n.id);
  else if(act === 'sib') openNew(f, n.p || null, n.o);
  else if(act === 'done') toggleDone(n.id);
  else if(act === 'today') put({...n, today: !n.today});
  else if(act === 'comment') openComment(f, n.id);
  else if(act === 'edit') openEdit(n.id);
  else if(act === 'fold') toggleCollapse(n.id);
  else if(act === 'del') removeWithUndo(n.id);
});

/* ---------- actions ---------- */
function toggleDone(id){
  const n = nodes.get(id); if(!n) return;
  const done = !n.done;
  put({...n, done, doneAt: done ? Date.now() : null});
  if(done) toast('Готово ✓');
}
function removeWithUndo(id){
  const ids = [id, ...descendants(id)];
  const backup = ids.map(i => ({...nodes.get(i)}));
  if(selected && ids.includes(selected)) selected = null;
  removeIds(ids);
  toast(ids.length > 1 ? `Удалено с подзадачами: ${ids.length}` : 'Удалено', 'Вернуть', () => { backup.forEach(n => put(n, true)); render(); });
}
function addNode(f, p, text, extra = {}, afterO){
  const t = text.trim(); if(!t) return null;
  let o = Date.now();
  if(afterO != null){
    const sibs = (index().get(f+'|'+(p||'')) || []).map(s => s.o).filter(x => x > afterO).sort((a,b)=>a-b);
    o = sibs.length ? (afterO + sibs[0]) / 2 : afterO + 1000;
  }
  const n = {id:newId(), f, p:p||null, t, note:'', due:'', today:false, done:false, c:false, o, created:Date.now(), ...extra};
  if(p){ const par = nodes.get(p); if(par && par.c) put({...par, c:false}, true); }
  put(n);
  return n;
}

/* ---------- sheet ---------- */
let sheet = null;
const sheetEl = $('#sheet');
function openSheet(s){
  sheet = s;
  const n = s.id ? nodes.get(s.id) : null;
  $('#sTitle').textContent = n ? 'Изменить' : s.proj ? 'Новый проект' : s.p ? 'Новая подзадача' : s.quick ? 'Записать мысль' : 'Новая ветка';
  const par = s.p ? nodes.get(s.p) : null;
  $('#sCrumb').textContent = n ? [FM[n.f].name, ...crumb(n)].join(' › ') : s.quick ? '' : [FM[s.f].name, ...(par ? [...crumb(par), par.t] : [])].join(' › ');
  $('#sCrumb').hidden = !$('#sCrumb').textContent;
  $('#sFolders').hidden = !s.quick && !n;
  $('#sFolders').innerHTML = folderChips(s.f, 'sf');
  $('#fText').value = n ? n.t : '';
  $('#fNote').value = n ? (n.note || '') : '';
  $('#fDue').value = n ? (n.due || '') : '';
  $('#fAmt').value = n ? (n.amt || '') : '';
  $('#fDueL').textContent = (n ? isSubNode(n) : s.p && nodes.get(s.p) && nodes.get(s.p).fk === 'sub') ? 'Истекает' : 'Срок';
  s.st = n ? (n.st || '') : ''; renderStChips();
  $('#fGoal').value = n ? (n.goal || '') : '';
  $('#fPct').value = n && n.pct !== undefined && n.pct !== null ? n.pct : '';
  $('#fMet').hidden = s.f !== 'social';
  for(const [el, k] of MET) $('#' + el).value = n && n[k] !== undefined && n[k] !== null ? n[k] : '';
  s.today = n ? !!n.today : false;
  $('#fToday').setAttribute('aria-pressed', String(s.today));
  $('#fDel').hidden = !n; $('#fMore').hidden = !!n;
  sheetEl.hidden = false;
  setTimeout(() => $('#fText').focus(), 60);
}
const MET = [['fKpi','kpi'],['fKv','kv'],['fKt','kt'],['fSubs','subs'],['fHandle','handle'],['fViews','views'],['fCtype','ctype'],['fAuto','auto']];
function renderStChips(){
  $('#fSt').innerHTML = ['', ...Object.keys(ST)].map(k => `<button type="button" class="chip" style="--c:${k ? ST[k].c : 'var(--muted)'}" data-stv="${k}" aria-pressed="${!!sheet && sheet.st === k}"><span class="dot" style="border-radius:50%"></span>${k ? ST[k].l : 'Статус: авто'}</button>`).join('');
}
function closeSheet(){ sheetEl.hidden = true; sheet = null; }
function openNew(f, p, afterO){ openSheet({f, p, afterO}); }
function openEdit(id){ const n = nodes.get(id); if(n) openSheet({id, f:n.f, p:n.p}); }
function saveSheet(more){
  if(!sheet) return;
  const text = $('#fText').value.trim();
  const pv = $('#fPct').value;
  const fields = {note: $('#fNote').value.trim(), due: $('#fDue').value, amt: $('#fAmt').value.trim(), today: sheet.today, st: sheet.st || '', goal: $('#fGoal').value.trim(), pct: pv === '' ? '' : Math.max(0, Math.min(100, Math.round(+pv) || 0))};
  if(!sheet.id && sheet.proj) fields.proj = true;
  if(!$('#fMet').hidden) for(const [el, k] of MET){ const v = $('#' + el).value.trim(); fields[k] = ['kv','kt','subs'].includes(k) && v !== '' && num(v) !== null ? num(v) : v; }
  if(sheet.id){
    const n = nodes.get(sheet.id);
    if(n && text){
      const upd = {...n, t:text, ...fields};
      if(sheet.f !== n.f){ // move to another folder with its subtree, to the root
        upd.f = sheet.f; upd.p = null;
        descendants(n.id).forEach(d => put({...nodes.get(d), f: sheet.f}, true));
      }
      put(upd);
    }
    closeSheet(); return;
  }
  if(!text){ if(!more) closeSheet(); return; }
  const n = addNode(sheet.f, sheet.p, text, fields, sheet.afterO);
  if(sheet.quick){ toast(`Записано в «${FM[sheet.f].name}»`); }
  if(more){
    sheet.afterO = n ? n.o : sheet.afterO;
    $('#fText').value = ''; $('#fNote').value = ''; $('#fDue').value = ''; $('#fAmt').value = ''; $('#fGoal').value = ''; $('#fPct').value = '';
    sheet.today = false; $('#fToday').setAttribute('aria-pressed','false');
    $('#fText').focus();
  } else {
    if(route.view === 'folder' && route.mode === 'map' && n && n.f === route.f) { selected = n.id; render(); }
    closeSheet();
  }
}
$('#form').addEventListener('submit', e => { e.preventDefault(); saveSheet(false); });
$('#fMore').onclick = () => saveSheet(true);
$('#fText').addEventListener('keydown', e => { if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); saveSheet(!sheet?.id && !sheet?.quick); } });
$('#fToday').onclick = () => { sheet.today = !sheet.today; $('#fToday').setAttribute('aria-pressed', String(sheet.today)); };
$('#fDel').onclick = () => { const id = sheet.id; closeSheet(); removeWithUndo(id); };
$('#scrim').onclick = closeSheet;
$('#sFolders').addEventListener('click', e => {
  const c = e.target.closest('[data-sf]'); if(!c || !sheet) return;
  sheet.f = c.dataset.sf; if(sheet.quick){ sheet.p = null; }
  $('#sFolders').querySelectorAll('[data-sf]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.sf === sheet.f)));
});
addEventListener('keydown', e => {
  if(e.key === 'Escape'){ if(!$('#csheet').hidden){ $('#csheet').hidden = true; csheet = null; } else if(!sheetEl.hidden) closeSheet(); else if(selected){ selected = null; render(); } }
  if(sheetEl.hidden && route.view==='folder' && route.mode==='map' && selected && document.activeElement === document.body){
    if(e.key === 'Tab'){ e.preventDefault(); openNew(route.f, selected==='root'?null:selected); }
    else if(e.key === 'Enter' && selected !== 'root'){ e.preventDefault(); const n = nodes.get(selected); if(n) openNew(route.f, n.p||null, n.o); }
    else if((e.key === 'Delete' || e.key === 'Backspace') && selected !== 'root'){ e.preventDefault(); removeWithUndo(selected); }
    else if(e.key === ' ' && selected !== 'root'){ e.preventDefault(); toggleDone(selected); }
  }
});

  const t = e.target;

  const cop = t.closest('[data-chatopen]'); if(cop){ const c = nodes.get(cop.dataset.chatopen); if(c) put({...c, st:'ans'}); return; }
  const cf = t.closest('[data-capf]'); if(cf){ captureFolder = cf.dataset.capf; lsSet('cg2-capf', captureFolder); document.querySelectorAll('[data-capf]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.capf === captureFolder))); return; }
  const dn = t.closest('[data-done]'); if(dn){ toggleDone(dn.dataset.done); return; }

  if(t.closest('#nudge')){ openMenu(); return; }
  if(t.closest('[data-showdone]')){ showDone = !showDone; lsSet('cg2-showdone', showDone ? '1' : '0'); render(); return; }
});
document.addEventListener('submit', e => {
  if(e.target.id === 'capForm'){ e.preventDefault(); const i = $('#capText'); if(addNode(captureFolder, null, i.value)){ i.value = ''; toast(`Записано в «${FM[captureFolder].name}»`); } }
  if(e.target.dataset && e.target.dataset.cform !== undefined){
    e.preventDefault(); const id = e.target.dataset.cform, n = nodes.get(id), i = e.target.querySelector('input'), v = i.value.trim();
    if(n && v){ i.value = ''; pushComment(n.f, id, v); render(); const ni = document.querySelector(`[data-cform="${id}"] input`); if(ni) ni.focus(); }
    return;
  }
  if(e.target.id === 'chatForm'){ e.preventDefault(); const c = nodes.get(route.id), i = $('#chatText'), v = i.value.trim(); if(c && v){ i.value = ''; put({...c, st:'wait', msgs:[...(c.msgs || []), {w:'me', at:Date.now(), t:v}]}); } }
  if(e.target.id === 'listForm'){ e.preventDefault(); const i = $('#listText'); if(addNode(route.f, null, i.value)){ i.value = ''; setTimeout(() => $('#listText') && $('#listText').focus(), 0); } }
});
$('#back').onclick = () => { if(route.view === 'chat'){ const c = nodes.get(route.id); go(c && FM[c.folder] ? {view:'folder', f:c.folder, mode:'board'} : {view:'chats'}); } else go({view:'home'}); };
$('#fab').onclick = () => {
  const f = route.view === 'folder' ? route.f : captureFolder;
  if(route.view === 'folder' && route.mode === 'map') openNew(f, null);
  else openSheet({f, p:null, quick: true});
};

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg, actionLabel, action){
  const el = $('#toast');
  el.innerHTML = `<span>${esc(msg)}</span>` + (actionLabel ? `<button>${esc(actionLabel)}</button>` : '');
  el.hidden = false;
  if(actionLabel) el.querySelector('button').onclick = () => { el.hidden = true; action(); };
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.hidden = true, actionLabel ? 6000 : 2200);
}

route = parse(location.hash);
render();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if(route.view === 'folder' && route.mode === 'map'){ const f = route.f; delete cams[f]; } render(); });

/* ---------- backup ---------- */
const menuEl = $('#menu');
function backupAge(){ const t = +lsGet('cg2-lastbackup') || 0; return t ? Math.floor((Date.now()-t)/864e5) : null; }
function openMenu(){
  const a = backupAge();
  $('#backupInfo').textContent = `Задач: ${nodes.size}. ` + (a === null ? 'Копию ещё не сохраняли.' : a === 0 ? 'Последняя копия — сегодня.' : `Последняя копия — ${a} дн. назад.`);
  renderSyncInfo();
  menuEl.hidden = false;
}

/* ---------- sync via private GitHub repo ---------- */
const SYNC_URL = 'https://api.github.com/repos/mirinhofootball-prog/golova-data/contents/tasks.json';
let syncToken = lsGet('cg2-token') || '';
let syncing = false, syncAgain = false, syncTimer = null, syncErr = '';
let lastSync = +lsGet('cg2-lastsync') || 0;
GKey.restore().then(v => { if(v && !syncToken){ syncToken = v; syncNow(); } });
function scheduleSync(delay = 3000){
  if(!syncToken) return;
  clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, delay);
}
const b64e = s => { const b = new TextEncoder().encode(s); let bin = ''; for(let i = 0; i < b.length; i += 0x8000) bin += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(bin); };
const b64d = s => { const bin = atob(String(s).replace(/\s/g,'')); const b = new Uint8Array(bin.length); for(let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i); return new TextDecoder().decode(b); };
function gh(method, body){
  return fetch(SYNC_URL + (method === 'GET' ? '?ref=main&_=' + Date.now() : ''), {
    method, cache: 'no-store',
    headers: { Authorization: 'Bearer ' + syncToken, Accept: 'application/vnd.github+json', ...(body ? {'Content-Type':'application/json'} : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
}
const foreign = new Map(); // nodes from folders unknown to this app version: kept and written back untouched
function mergeRemote(remote){
  let changed = false;
  for(const [id, ts] of Object.entries(remote.deleted || {})) if(!tombs[id] || tombs[id] < ts) tombs[id] = ts;
  for(const n of remote.nodes || []){
    if(!n || typeof n.id !== 'string' || typeof n.t !== 'string') continue;
    if(OLDF[n.f]) n.f = OLDF[n.f];
    if(!known(n.f)){ const fo = foreign.get(n.id); if(!fo || (n.ts||0) > (fo.ts||0)) foreign.set(n.id, n); continue; }
    const cur = nodes.get(n.id);
    if(!cur || (n.ts || 0) > (cur.ts || 0)){ nodes.set(n.id, n); changed = true; }
  }
  for(const [id, ts] of Object.entries(tombs)){ const fo = foreign.get(id); if(fo && (fo.ts || 0) <= ts) foreign.delete(id); const n = nodes.get(id); if(n && (n.ts || 0) <= ts){ nodes.delete(id); changed = true; } }
  const cut = Date.now() - 120*864e5;
  for(const id in tombs) if(tombs[id] < cut) delete tombs[id];
  return changed;
}
const sig = o => (o.nodes || []).map(n => n.id + ':' + (n.ts || 0)).sort().join(',') + '|' + Object.entries(o.deleted || {}).map(([k,v]) => k + ':' + v).sort().join(',');
async function syncNow(){
  clearTimeout(syncTimer);
  if(!syncToken){ renderSyncInfo(); return; }
  if(!navigator.onLine){ syncErr = 'Нет интернета — синхронизирую, когда появится'; renderSyncInfo(); return; }
  if(syncing){ syncAgain = true; return; }
  syncing = true; syncErr = ''; renderSyncInfo();
  try {
    for(let attempt = 0; attempt < 3; attempt++){
      const r = await gh('GET');
      let remote = {nodes:[], deleted:{}}, sha;
      if(r.status === 200){ const j = await r.json(); sha = j.sha; try { remote = JSON.parse(b64d(j.content || '')) || remote; } catch {} }
      else if(r.status === 401 || r.status === 403) throw new Error('auth');
      else if(r.status !== 404) throw new Error('http');
      if(mergeRemote(remote)){ saveLocal(); render(); }
      saveTombs();
      const mine = {app:'golova', v:1, appver:'2026-11-18', updated:new Date().toISOString(), nodes:[...nodes.values(), ...foreign.values()], deleted:tombs};
      if(sig(mine) === sig(remote)) break;
      const p = await gh('PUT', {message:'sync ' + mine.updated, content:b64e(JSON.stringify(mine)), branch:'main', ...(sha ? {sha} : {})});
      if(p.ok) break;
      if(p.status === 401 || p.status === 403) throw new Error('auth');
      if(p.status !== 409 && p.status !== 422) throw new Error('http');
    }
    lastSync = Date.now(); lsSet('cg2-lastsync', String(lastSync));
  } catch(e) {
    syncErr = e && e.message === 'auth' ? 'Ключ не подходит: проверь, что у него есть доступ к golova-data (Contents: Read and write)' : 'GitHub не ответил — попробую ещё раз';
  }
  syncing = false; renderSyncInfo();
  if(syncAgain){ syncAgain = false; scheduleSync(500); }
}
function renderSyncInfo(){
  const dot = $('#sync');
  dot.hidden = !syncToken;
  dot.className = 'sync ' + (syncErr ? 'err' : syncing ? 'slow' : 'ok');
  dot.title = syncErr || 'Синхронизировано';
  $('#syncOff').hidden = !!syncToken; $('#syncOn').hidden = !syncToken;
  const ago = lastSync ? Math.round((Date.now() - lastSync)/60000) : null;
  $('#syncInfo').textContent = !syncToken
    ? 'Подключи ключ, и задачи будут одинаковыми на телефоне и компьютере.'
    : syncErr || (syncing ? 'Синхронизирую…' : ago === null ? 'Ещё не синхронизировано' : ago < 1 ? 'Синхронизировано только что' : `Синхронизировано ${ago} мин назад`);
}
$('#tokenSave').onclick = () => {
  const v = $('#tokenInput').value.trim();
  if(!/^(github_pat_|ghp_)[A-Za-z0-9_]{20,}$/.test(v)){ toast('Это не похоже на ключ GitHub'); return; }
  syncToken = v; GKey.set(v); $('#tokenInput').value = '';
  syncNow();
};
$('#tokenDrop').onclick = () => { syncToken = ''; GKey.clear(); syncErr = ''; renderSyncInfo(); };
$('#syncNowBtn').onclick = () => syncNow();
addEventListener('online', () => scheduleSync(300));
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') scheduleSync(300); });
setInterval(() => { if(document.visibilityState === 'visible') scheduleSync(0); }, 60000);
setInterval(() => { if(!menuEl.hidden) renderSyncInfo(); }, 20000);
renderSyncInfo();
scheduleSync(500);
$('#menuBtn').onclick = openMenu;
menuEl.addEventListener('click', e => { if(e.target.closest('[data-closemenu]')) menuEl.hidden = true; });
$('#exportBtn').onclick = async () => {
  const name = 'golova-' + todayStr() + '.json';
  const data = JSON.stringify({app:'chistaya-golova', v:1, at:new Date().toISOString(), nodes:[...nodes.values()]});
  const file = new File([data], name, {type:'application/json'});
  const mobile = matchMedia('(pointer: coarse)').matches;
  try {
    if(mobile && navigator.canShare && navigator.canShare({files:[file]})) await navigator.share({files:[file], title:name});
    else {
      const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name;
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    }
    lsSet('cg2-lastbackup', String(Date.now())); menuEl.hidden = true; toast('Копия сохранена'); render();
  } catch(err) { if(err && err.name !== 'AbortError') toast('Не получилось сохранить файл'); }
};
$('#importBtn').onclick = () => $('#importFile').click();
$('#importFile').onchange = async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if(!f) return;
  try {
    const d = JSON.parse(await f.text());
    if(!d || !Array.isArray(d.nodes)) throw new Error('bad');
    let added = 0, updated = 0;
    for(const n of d.nodes){
      if(n && OLDF[n.f]) n.f = OLDF[n.f];
      if(!n || typeof n.id !== 'string' || !known(n.f) || typeof n.t !== 'string') continue;
      const cur = nodes.get(n.id);
      if(!cur){ nodes.set(n.id, n); added++; }
      else if((n.ts||0) > (cur.ts||0)){ nodes.set(n.id, n); updated++; }
    }
    saveLocal(); menuEl.hidden = true; render(); scheduleSync(300);
    toast(`Загружено: новых ${added}, обновлено ${updated}`);
  } catch { toast('Это не файл копии «Головы»'); }
};

/* ---------- offline ---------- */
if('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
})();
